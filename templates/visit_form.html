{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="card-title mb-0"><i class="bi bi-calendar-plus me-2"></i>Schedule Home Visit</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('add_visit') }}" method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Select Household <span class="text-danger">*</span></label>
                        <select name="household_id" class="form-select" required>
                            <option value="">-- Choose Household --</option>
                            {% for h in households %}
                            <option value="{{ h.id }}">{{ h.household_number }} - Head: {{ h.head_name }} ({{ h.area }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Visit Date <span class="text-danger">*</span></label>
                        <input type="date" name="visit_date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Purpose of Visit <span class="text-danger">*</span></label>
                        <textarea name="purpose" class="form-control" rows="3" placeholder="e.g. Routine ANC Visit, Immunization follow-up, General Health Assessment" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Initial Observations / Notes</label>
                        <textarea name="observations" class="form-control" rows="2" placeholder="Optional notes before visit"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('visits') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Schedule Visit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
