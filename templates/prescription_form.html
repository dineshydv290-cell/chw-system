{% extends "base.html" %}

{% block title %}Prescribe Medicine - CHW Digital Records{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 650px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h4 class="mb-0 text-primary fw-bold"><i class="bi bi-capsule me-2"></i>Prescribe / Dispense Medicine</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="beneficiary_id" class="form-label fw-bold">Beneficiary <span class="text-danger">*</span></label>
                    <select class="form-select" id="beneficiary_id" name="beneficiary_id" required>
                        <option value="">-- Select Beneficiary --</option>
                        {% for b in beneficiaries %}
                            <option value="{{ b.id }}">{{ b.full_name }} (Health ID: {{ b.health_id }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="medicine_id" class="form-label fw-bold">Medicine <span class="text-danger">*</span></label>
                    <select class="form-select" id="medicine_id" name="medicine_id" required>
                        <option value="">-- Select Medicine --</option>
                        {% for m in medicines %}
                            <option value="{{ m.id }}">{{ m.medicine_name }} (Available Stock: {{ m.stock_quantity }} {{ m.unit }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dosage" class="form-label fw-bold">Dosage <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="dosage" name="dosage" placeholder="e.g. 1 Tablet twice daily" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="duration" class="form-label fw-bold">Duration <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="duration" name="duration" placeholder="e.g. 5 Days" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="quantity_dispensed" class="form-label fw-bold">Quantity Dispensed <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="quantity_dispensed" name="quantity_dispensed" value="1" min="1" required>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('medicines') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save & Dispense</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
